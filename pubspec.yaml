name: jyotessa_app
description: "Jyotessa — handmade soy candles, pearled candle kits and gift sets."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Networking & storage
  dio: ^5.7.0
  shared_preferences: ^2.3.3

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.20.1

  # Device integrations
  url_launcher: ^6.3.1
  device_info_plus: ^11.2.0
  crypto: ^3.0.6
  smooth_page_indicator: ^1.2.0+3
  share_plus: ^10.1.4

  # Login, payments, push
  google_sign_in: ^6.2.2
  razorpay_flutter: ^1.4.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# App icon — the Jyotessa J-candle mark (from candle-studio/public)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  remove_alpha_ios: true
  background_color_ios: "#FFF9F5"
  adaptive_icon_background: "#FFF9F5"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  min_sdk_android: 21

# Splash — logo on the brand chocolate background
flutter_native_splash:
  color: "#3A1507"
  image: assets/images/splash_logo.png
  android_12:
    color: "#3A1507"
    image: assets/images/splash_logo_android12.png
  fullscreen: false
